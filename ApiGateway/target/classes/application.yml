server:
  port: 8080

spring:
  application:
    name: ApiGateway
  cloud:
    gateway:
      routes:
        - id: account-service
          uri: http://localhost:8081
          predicates:
            - Path=/account,/account/**
          filters:
            - RewritePath=/account(?<segment>/?.*), /api/v1/Internal/accounts$\{segment}
